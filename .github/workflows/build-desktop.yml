name: Build desktop .exe

# Push a tag like `desktop-v1.0.1` and this builds the .exe and attaches it to
# that Release — installed copies then self-update. Run it manually
# (workflow_dispatch) to get a build as a downloadable artifact without
# publishing a Release.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest

      # The tag drives the self-update comparison, so it must match version.py
      # or installed copies would never see (or would re-offer) this build.
      - name: Tag must match desktop/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys
          text = open("desktop/version.py", encoding="utf-8").read()
          version = re.search(r"__version__\s*=\s*['\"]([^'\"]+)", text).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          print(f"version.py={version}  tag={tag}")
          if tag != f"desktop-v{version}":
              print("MISMATCH — bump desktop/version.py to match the tag (or retag).")
              sys.exit(1)
          PY

      - name: Headless tests
        run: python -m pytest tests -k "not live" -q

      # Builds every tab offscreen; catches an import/UI break before packaging.
      - name: Selftest
        run: python desktop/main.py --selftest

      - name: Build the .exe
        run: pyinstaller desktop/GlassesImageDownloader.spec --noconfirm

      # A build attached to a Release must never carry a credential.
      - name: Scan the .exe for secrets
        shell: bash
        run: |
          python - <<'PY'
          import sys
          data = open("dist/GlassesImageDownloader.exe", "rb").read()
          bad = [p.decode() for p in (b"ghp_", b"github_pat_", b"postgresql://", b"sk-ant")
                 if p in data]
          print("secret scan:", bad or "clean")
          sys.exit(1 if bad else 0)
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassesImageDownloader-exe
          path: dist/GlassesImageDownloader.exe
          retention-days: 14

      - name: Attach the .exe to the Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "Desktop build $TAG"
          gh release upload "$TAG" dist/GlassesImageDownloader.exe --clobber
          echo "Attached GlassesImageDownloader.exe to $TAG"
